image:
  repository: student-api
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: student-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

externalSecret:
  enabled: true
  awsSecretName: student-api-db-conn
  k8sSecretName: student-api-db-secret
  secretKey: POSTGRES_CONN_STR
