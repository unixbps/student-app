---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: svc-student-api-dev-euw1
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    team: DevOps
    environment: dev
    cluster: in-cluster
    region: eu-west-1
    domain: service
    subdomain: student
spec:
  destination:
    name: in-cluster
    namespace: service-workshop-control-student-api
  project: student
  source:
    path: ./helm/app/student-api
    repoURL: https://github.com/unixbps/student-app
    targetRevision: main
    helm:
      releaseName: svc-student-api-dev-euw1
      valueFiles:
        - values.yaml
        - dev/values.eu-west-1.dev.yaml
